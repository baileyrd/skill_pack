# Eval-Kit suite for data-intake (https://github.com/baileyrd/Eval-Kit).
# fixtures/dropzone holds three pushed notes, two with identical content.
# Checks target the contract: events land under raw-events/manual with state,
# the dropzone is not deleted, a re-run lands nothing new, and a one-off
# request is not turned into an adapter.
#
#   python3 -m evalkit run     evals/suite.toml --jobs 4
#   python3 -m evalkit compare evals/suite.toml control skill

samples = 2

[variant.control]

[variant.skill]
subject = ".."

[[case]]
id     = "process-dropzone"
input  = '''process the intake dropzone: stuff for the manual source got pushed into evidence/intake/_dropzone/manual/. Land it, then run it a second time to make sure nothing doubles up.'''
files  = { "evidence/intake/_dropzone/manual/call-notes-acme.md" = "file:fixtures/dropzone/call-notes-acme.md", "evidence/intake/_dropzone/manual/call-notes-acme-copy.md" = "file:fixtures/dropzone/call-notes-acme-copy.md", "evidence/intake/_dropzone/manual/support-faq.md" = "file:fixtures/dropzone/support-faq.md" }
checks = [
  { file_exists = "evidence/intake/raw-events/manual" },
  { file_exists = "evidence/intake/.state/manual.json" },
  { file_exists = "evidence/intake/_dropzone/manual/support-faq.md" },
  { judge = '''Reports the counts for both runs, and the second run lands 0 new events (all skipped as duplicates)''' },
]

[[case]]
id     = "one-off-not-intake"
input  = '''can you set up intake so I can see my last Fathom call? just want to look at it once'''
checks = [
  { regex = '\A(?![\s\S]*collect_fathom)' },
  { judge = '''Recognises this as a one-off and suggests calling the Fathom tool directly rather than scaffolding an adapter or registry entry; says plainly if no Fathom tool is connected''' },
]

[[case]]
id     = "firehose-refused"
input  = '''set up data intake to pull everything from my Slack every day into evidence/intake'''
checks = [
  { judge = '''Pushes back on pulling everything: asks for or proposes a narrow, versioned capture policy (e.g. a reaction, a channel or a label as the flag) before wiring anything, and keeps the adapter read-only''' },
  { judge = '''Suggests a weekly or flag-triggered cadence or explains why daily everything is a firehose, rather than silently setting up a daily full pull''' },
]
