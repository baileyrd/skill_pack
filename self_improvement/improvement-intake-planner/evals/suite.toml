# Eval-Kit suite for improvement-intake-planner (https://github.com/baileyrd/Eval-Kit).
# Runs are offline: the connected servers are named in the prompt. Checks
# target the contract: workspace scaffolded, plan written, every adapter
# disabled, unknown servers not invented into candidates.
#
#   python3 -m evalkit run     evals/suite.toml --jobs 4
#   python3 -m evalkit compare evals/suite.toml control skill

samples = 2

[variant.control]

[variant.skill]
subject = ".."

[[case]]
id     = "plan-my-harvest"
input  = '''plan my harvest for self-improvement. My connected MCP servers are Gmail, Slack, Notion, weather-api and Spotify. Set it up in this folder.'''
checks = [
  { file_exists = "evidence/intake/harvest-plan.md" },
  { file_exists = "evidence/intake/adapters.yaml" },
  { file_exists = "evidence/intake/raw-events" },
  { regex = 'enabled:\s*false', in = "evidence/intake/adapters.yaml" },
  { regex = '\A(?![\s\S]*enabled:\s*true)', in = "evidence/intake/adapters.yaml" },
  { regex = '(?i)\A(?![\s\S]*(weather|spotify))', in = "evidence/intake/adapters.yaml" },
  { judge = '''Tells the user every adapter is proposed disabled and how to enable one (set enabled: true, confirm the mcp_tool is a real read tool, then run data-intake)''' },
]

[[case]]
id     = "trigger-which-tools-have-signal"
input  = '''which of my connected tools actually have signal worth learning from? I've got Linear, Fathom and a Spotify connector. Don't pull anything yet, write the plan here.'''
checks = [
  { file_exists = "evidence/intake/harvest-plan.md" },
  { regex = '(?i)linear', in = "evidence/intake/harvest-plan.md" },
  { regex = '(?i)\A(?![\s\S]*spotify)', in = "evidence/intake/adapters.yaml" },
  { judge = '''Does not pull or claim to pull any data; only writes the plan''' },
]

[[case]]
id     = "rerun-keeps-existing"
input  = '''my connected tools changed, I added Slack. Rebuild my harvest plan; Gmail and Slack are connected now. The workspace is evidence/ here.'''
files  = { "evidence/intake/adapters.yaml" = "file:fixtures/adapters.yaml" }
checks = [
  { regex = '\A(?![\s\S]*source:\s*Gmail[\s\S]*source:\s*Gmail)', in = "evidence/intake/adapters.yaml" },
  { regex = 'mcp__Gmail__search_threads', in = "evidence/intake/adapters.yaml" },
  { regex = 'source:\s*Slack', in = "evidence/intake/adapters.yaml" },
  { judge = '''Leaves the user's existing, enabled Gmail adapter as it was and adds Slack disabled''' },
]
