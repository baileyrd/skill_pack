name: CI

# This repo has no language manifest, so repo-config's stack-selected CI
# templates don't apply — its rule is "no manifest, no workflow," because an
# always-red workflow is worse than none. This is a deliberate exception: the
# checks below are lint over the repo's own structure, and each one exists
# because the thing it checks for actually broke here. See scripts/check_repo.py
# for the commit each check would have failed.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: repo checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # check_repo.py reads the git index and blob contents (exec bits,
          # CRLF), so it needs the real repository, not just a file tree.
          # Depth 1 is enough — no check looks at history.
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # check_repo.py stays standard library plus git.
      - name: Run repo checks
        run: python3 scripts/check_repo.py

      # The one install, made explicitly. skills-ref is the Agent Skills
      # spec's reference validator: an independent check that every skill's
      # frontmatter is what claude.ai and the Skills API accept, rather than
      # this repo's own reading of the spec. PyYAML is quick_validate.py's
      # dependency; without it test_quick_validate.py skips silently, so the
      # frontmatter allowlist was never tested in CI. Pinned so a release
      # can't change the verdict under an unrelated PR.
      - name: Install validators
        run: python3 -m pip install skills-ref==0.1.1 PyYAML==6.0.3

      - name: Validate skills against the spec
        run: |
          status=0
          for skill in $(git ls-files '*SKILL.md' | xargs -n1 dirname); do
            agentskills validate "$skill" || status=1
          done
          exit $status

      # Deliberately a separate step, not a sixth check inside check_repo.py.
      # ADR-0002 governs repo *checks* — lint over structure, admitted only
      # for a failure that actually happened — and says in as many words that
      # lint is not tests. Folding the suite in there would blur exactly the
      # line that ADR draws.
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
