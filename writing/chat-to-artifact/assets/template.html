<!DOCTYPE html>
<!--
  chat-to-artifact template. Fill the four double-brace placeholders below
  (TITLE twice, SUBTITLE, BODY, FOOTER); delete this comment when done.
  Body building blocks (plain HTML, no scripts):
    <section class="tldr"><p>...</p></section>         TL;DR box, first in BODY
    <h2>Section</h2> <p>...</p> <ul>/<ol>               normal prose
    <div class="decision"><strong>Decision</strong><p>Why ...</p></div>
    <div class="callout">Warning or caveat</div>
    <table><thead>...</thead><tbody>...</tbody></table> comparisons, action items
    <span class="tag">open</span> <span class="tag done">done</span>
    <pre><code>...</code></pre>                        commands or code only
    <details><summary>More</summary>...</details>       optional depth
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  :root {
    --bg: #faf9f5; --fg: #1f1e1d; --muted: #6b6a66; --line: #e5e3da;
    --card: #ffffff; --accent: #a54f31; --accent-bg: #f6ebe4; --ok: #2f6a47;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1f1e1d; --fg: #ecebe6; --muted: #a3a29c; --line: #3a3935;
      --card: #292826; --accent: #e08a68; --accent-bg: #3a2d26; --ok: #7cc49a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.65 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 48px 24px 64px; }
  header { border-bottom: 1px solid var(--line); margin-bottom: 28px; padding-bottom: 16px; }
  h1 { font: 600 2rem/1.2 ui-serif, Georgia, serif; margin: 0 0 8px; }
  .subtitle { color: var(--muted); margin: 0; }
  h2 { font: 600 1.3rem/1.3 ui-serif, Georgia, serif; margin: 36px 0 12px; }
  h3 { font-size: 1.05rem; margin: 24px 0 8px; }
  a { color: var(--accent); }
  .tldr {
    background: var(--accent-bg); border-left: 4px solid var(--accent);
    border-radius: 8px; padding: 14px 18px; margin: 0 0 8px;
  }
  .tldr p { margin: 0; }
  .decision {
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    padding: 12px 16px; margin: 12px 0;
  }
  .decision p { margin: 4px 0 0; color: var(--muted); }
  .callout { border: 1px dashed var(--accent); border-radius: 8px; padding: 10px 14px; margin: 12px 0; }
  table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: .95rem; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  .tag {
    display: inline-block; font-size: .8rem; padding: 1px 8px; border-radius: 99px;
    background: var(--accent-bg); color: var(--accent);
  }
  .tag.done { color: var(--ok); }
  code { font-family: var(--mono); font-size: .9em; }
  pre { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; overflow-x: auto; }
  details { margin: 12px 0; }
  summary { cursor: pointer; color: var(--muted); }
  footer { margin-top: 48px; color: var(--muted); font-size: .85rem; border-top: 1px solid var(--line); padding-top: 12px; }
  @media print {
    body { background: #fff; color: #000; }
    main { padding: 0; }
    a { color: inherit; }
    details { display: block; }
  }
</style>
</head>
<body>
<main>
<header>
  <h1>{{TITLE}}</h1>
  <p class="subtitle">{{SUBTITLE}}</p>
</header>
{{BODY}}
<footer>{{FOOTER}}</footer>
</main>
</body>
</html>
