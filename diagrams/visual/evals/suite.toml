# Eval-Kit suite for visual (https://github.com/baileyrd/Eval-Kit).
# Checks target the skill's contract: one self-contained HTML page (no CDN
# scripts), at least one inline SVG diagram of the real mechanism, plan mode
# leaving source untouched, and map mode covering every skill in a pack.
# fixtures/svc is a small link shortener (FastAPI, SQLite, Redis); plan.md is
# a drafted change to it; fixtures/pack is a two-skill pack where alpha hands
# off to beta. Headless Chrome is needed for the layout audit; without it the
# reply should say the audit did not run.
#
#   python3 -m evalkit run     evals/suite.toml --jobs 4
#   python3 -m evalkit compare evals/suite.toml control skill

samples       = 2
allowed_tools = ["Bash"]

[variant.control]

[variant.skill]
subject = ".."

[[case]]
id     = "explore-service"
input  = '''Visualise how the svc/ folder works as a single HTML page I can open offline. Save it as visual.html.'''
files  = { "svc/api.py" = "file:fixtures/svc/api.py", "svc/codes.py" = "file:fixtures/svc/codes.py", "svc/store.py" = "file:fixtures/svc/store.py" }
checks = [
  { regex = '<svg[\s>]', in = "visual.html" },
  { regex = '\A(?![\s\S]*<script[^>]+src=["\x27]https?:)', in = "visual.html" },
  { judge = '''visual.html contains a diagram of the real mechanism: the two routes in api.py, codes.new_code, store.py's SQLite links table and the Redis hit counter, with edges in the direction calls and data flow''' },
]

[[case]]
id     = "plan-picture-read-only"
input  = '''/visual plan plan.md — save the page as plan.html'''
files  = { "plan.md" = "file:fixtures/plan.md", "svc/api.py" = "file:fixtures/svc/api.py", "svc/codes.py" = "file:fixtures/svc/codes.py", "svc/store.py" = "file:fixtures/svc/store.py" }
checks = [
  { regex = '<svg[\s>]', in = "plan.html" },
  { judge = '''No file under svc/ was changed and no svc/sweeper.py or tests/ file was created: plan mode stays read-only and only writes the page (and its own scratch data)''' },
  { judge = '''plan.html pictures the planned change: the new expires_at column, the 410 path in GET /{code}, and the new sweeper job touching both SQLite and Redis, marked as new or changed''' },
]

[[case]]
id     = "map-skill-pack"
input  = '''Map the skill pack in pack/ as a zoomable drill-down map: which skills there are, what they run, and how they hand off. Save it as map.html.'''
files  = { "pack/alpha/SKILL.md" = "file:fixtures/pack/alpha.SKILL.md", "pack/alpha/scripts/collect.py" = "file:fixtures/pack/alpha.collect.py", "pack/beta/SKILL.md" = "file:fixtures/pack/beta.SKILL.md" }
checks = [
  { file_exists = "map.html" },
  { regex = '(?i)alpha[\s\S]*beta|beta[\s\S]*alpha', in = "map.html" },
  { judge = '''map.html shows both skills, alpha's collect.py script, and an edge from alpha to beta for the hand-off, with each skill's what/when filled from its SKILL.md rather than left empty''' },
]
