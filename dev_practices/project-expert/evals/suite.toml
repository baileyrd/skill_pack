# Eval-Kit suite for project-expert (https://github.com/baileyrd/Eval-Kit).
# Cases come from evals.json; the design chat is inputs/design-chat.md. Checks
# target what the skill adds over a plain kickoff prompt: the docs/handoff pack,
# provenance tags that match who decided what, honest open items, and a short
# kickoff prompt that points at the pack instead of restating it.
#
#   python3 -m evalkit run     evals/suite.toml --jobs 4
#   python3 -m evalkit compare evals/suite.toml control skill

samples = 2

[variant.control]

[variant.skill]
subject = ".."

[[case]]
id     = "handoff-new-repo"
input  = '''The design chat we just had is saved in design-chat.md. Ok write me a prompt to stand this up in Claude Code. Repo will be baileyrd/tick_digest, doesn't exist yet. Put any files you make in this folder.'''
files  = { "design-chat.md" = "file:inputs/design-chat.md" }
checks = [
  { file_exists = "docs/handoff/SPEC.md" },
  { file_exists = "docs/handoff/DECISIONS.md" },
  { file_exists = "docs/handoff/OPEN_QUESTIONS.md" },
  { regex = '\[stated\]', in = "docs/handoff/DECISIONS.md" },
  { judge = '''DECISIONS.md tags the user's own choices (standalone Rust single binary, Tick HTTP API on localhost:7420, no empty posts, 6:30 Central) as [stated], and the three-sections/10-item format that Claude proposed and the user accepted as [agreed] rather than [stated] or [default]''' },
  { judge = '''Whether to post on weekends is recorded as an open item ([open]) in OPEN_QUESTIONS.md, not decided silently''' },
  { judge = '''The reply ends with a kickoff prompt of at most 6 lines that points Claude Code at docs/handoff/ and names a first slice to build, without pasting the spec into the prompt, and the run does not claim to have created the GitHub repo''' },
]

[[case]]
id     = "resolve-open-questions"
input  = '''The design chat is in design-chat.md. CC came back with these, answer the open questions for tick_digest: 1) Should overdue include tasks with no due date? 2) Weekends: post or not? 3) What if the Tick API is down at 6:30? The repo isn't reachable from here, so write the answers to a file.'''
files  = { "design-chat.md" = "file:inputs/design-chat.md" }
checks = [
  { judge = '''Q1 (tasks with no due date in overdue) is answered as a [default], Claude's own choice, since the chat never discussed it, not presented as something the user decided''' },
  { judge = '''Q2 (weekends) is left open or put back to the user, since the user said they were not sure; it is not answered as settled''' },
  { judge = '''Q3 (Tick API down) gets a reversible default (e.g. retry then post an error notice or skip) tagged [default]''' },
  { judge = '''The answers are written to a file under docs/handoff/ (e.g. RESOLVED-<date>.md) with one entry per question giving the answer, its tag and the pack file it belongs in, and the reply lists what was answered and what is still open''' },
]

[[case]]
id     = "trigger-terse-hand-off"
input  = '''hand this off to CC (design chat is in design-chat.md, repo will be baileyrd/tick_digest, not created yet)'''
files  = { "design-chat.md" = "file:inputs/design-chat.md" }
checks = [
  { file_exists = "docs/handoff/SPEC.md" },
  { file_exists = "docs/handoff/QA.md" },
  { judge = '''QA.md holds implementer questions answered from the chat (for example timezone/DST handling, where the webhook URL comes from, behaviour with more than 10 items), each tagged [stated], [agreed], [default] or [open]''' },
]

[[case]]
id     = "harvest-mixed-provenance"
input  = '''Harvest the decisions for tick_digest and build its expert. Sources are in repo-docs.txt, prs.txt, remindme.txt and cards.txt (the repo, merged PRs with reviews, remind-me, Mill Board cards). I am baileyrd. The repo is not reachable, so put the files in this folder.'''
files  = { "repo-docs.txt" = "file:inputs/harvest/repo-docs.txt", "prs.txt" = "file:inputs/harvest/prs.txt", "remindme.txt" = "file:inputs/harvest/remindme.txt", "cards.txt" = "file:inputs/harvest/cards.txt" }
checks = [
  { file_exists = "docs/handoff/SPEC.md" },
  { file_exists = "docs/handoff/DECISIONS.md" },
  { file_exists = ".claude/agents/tick_digest-expert.md" },
  { regex = 'Harvested: 2026-\d\d-\d\d @ 9f8e7d6', in = "docs/handoff/SPEC.md" },
  { judge = '''DECISIONS.md tags [stated] only where baileyrd's own words are quoted in a Source column: SQLite only (PR #12), NDJSON (PR #15), weekly Monday 8:00 (mem_a), cap of 8 items (card 31). No [agreed] tags appear.''' },
  { judge = '''Everything settled by dottius, an ADR, a copilot review, "Nano prefers short digests" (model-written, no quote), or card 40 is tagged [default], not [stated]. The CSV drop (PR #18, no user comment) is [open] or listed in OPEN_QUESTIONS, never [stated].''' },
  { judge = '''The port conflict is resolved for the code value 7421 (code beats memory) and OPEN_QUESTIONS.md records both sources (src/config.rs and mem_c). NDJSON is a newer row that supersedes the JSON row (the old row is kept), and the 3-sections/10-items card comment is superseded by the user's cap of 8.''' },
  { judge = '''The reply or files show the remind-me alias step first (tickdigest, tick_digest, tick-digest resolved to one project via remind_me_project / remind_me_entity_upsert), before the sources are searched.''' },
  { judge = '''.claude/agents/tick_digest-expert.md has name tick_digest-expert, a first step that loads remind-me tools through ToolSearch and continues from the pack if they are missing, and the root CLAUDE.md has ONE "Project experts" routing table with the cloud fallback (read the agent file fresh, spawn a general-purpose Agent with its body plus the question) and no copy of the agent file's text.''' },
  { judge = '''SPEC.md is an index (subsystem, doc paths, owner, status), not a restatement of the docs, and delivery runs the acceptance checks (answer with a source, log one default, escalate one reversal) with results recorded in the PR and remind-me.''' },
]

[[case]]
id     = "refresh-append-only"
input  = '''Refresh the tick_digest pack. The current SPEC/DECISIONS and what happened since the last harvest are in existing-decisions.txt. Write the updated files to this folder.'''
files  = { "existing-decisions.txt" = "file:inputs/harvest/existing-decisions.txt" }
checks = [
  { regex = '\| D1 \| SQLite only', in = "docs/handoff/DECISIONS.md" },
  { regex = '\| D2 \| Output JSON', in = "docs/handoff/DECISIONS.md" },
  { regex = 'D3', in = "docs/handoff/DECISIONS.md" },
  { judge = '''D1 and D2 are unchanged, tag included. The NDJSON change is a new D3 row saying it supersedes D2, tagged [stated] with baileyrd's quote; the --quiet flag from PR #21 is a new D4 row tagged [default].''' },
  { judge = '''The only in-place edit is the Harvested line in SPEC.md, updated to today's date and the current sha; nothing already harvested is re-derived.''' },
]

[[case]]
id     = "no-pack-monorepo"
input  = '''Set up an expert for the Orion project in this monorepo (paths crates/orion/**). A DECISIONS.md (D1-D20) is at docs/orion/DECISIONS.md on an unmerged branch. No handoff pack yet. Reviewer: alice. Put files you make in this folder.'''
checks = [
  { judge = '''DECISIONS.md is a pointer to docs/orion/DECISIONS.md that keeps its D-numbering; the CLAUDE.md row is scoped to crates/orion/** only; the PR plan branches from the unmerged docs branch and names the reviewer; unsourced items are in OPEN_QUESTIONS and listed in the PR body.''' },
]

[[case]]
id     = "pack-exists-migrate"
input  = '''build an expert for tick_digest; docs/handoff already exists from an older project-handoff with a project-expert.md agent. Put files you make in this folder.'''
checks = [
  { judge = '''SPEC and DECISIONS are untouched; the agent is renamed tick_digest-expert; the old CLAUDE.md block is replaced by one Project experts table; no second pack is written.''' },
]

[[case]]
id     = "implicit-trigger"
input  = '''I am tired of relaying design questions between Claude sessions for this repo. Fix that. Put files you make in this folder.'''
checks = [
  { judge = '''Uses single-repo defaults (docs/handoff, glob **), asks at most one blocking question, invents no decisions, and puts unsourced items in OPEN_QUESTIONS.md.''' },
]
